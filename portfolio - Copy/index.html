<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Hussain Ahmed Humaidi — CSE student & aspiring software engineer. Competitive programmer building clean software with C++, Python, DSA and modern web tech."
    />
    <meta name="theme-color" content="#030712" />

    <!-- Set the theme class before first paint to avoid a flash of the wrong theme. -->
    <script>
      (function () {
        try {
          // Dark-mode-first portfolio: default to dark unless the visitor
          // has explicitly chosen light before.
          var stored = localStorage.getItem('theme');
          var theme = stored || 'dark';
          document.documentElement.classList.add(theme);
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>

    <!-- Fonts: Space Grotesk (display), Inter (body), JetBrains Mono (code) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <title>Hussain Ahmed Humaidi — CSE Student & Aspiring Software Engineer</title>
